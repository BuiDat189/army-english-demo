<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15233d" />
    <title>ARMY ENGLISH – Quản lý chi nhánh</title>
    <script>
      // Đặt nền sáng/tối TRƯỚC khi vẽ trang để không nháy trắng khi mở ở nền tối
      (function () {
        var p = 'system';
        try { p = localStorage.getItem('army.theme') || 'system'; } catch (e) { /* bỏ qua */ }
        var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
